<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="990" viewBox="0 0 760 330" font-family="Happy Monkey, Comic Neue, Humor Sans, sans-serif"><rect width="760" height="330" fill="#fff"/><text x="20" y="24" font-size="13" fill="#1E3A5F"  font-weight="bold">Départs attendus d’ici 2030 dans un département fictif : 200 départs</text><path d="M19.6 44.7 Q127.6 43.4 236.2 43.8 Q237.5 65.4 235.4 87.2 Q128.4 89.6 20.2 87.2 Q18.2 65.5 19.7 44.8 Z" fill="#FBE4E1" stroke="#B2182B" stroke-width="1.6" stroke-linejoin="round"/><path d="M20.1 43.2 Q127.6 44.0 236.2 44.3 Q236.6 66.0 234.4 88.0 Q127.2 88.2 20.3 87.4 Q19.7 65.7 21.5 44.3 Z" fill="none" stroke="#B2182B" stroke-width="0.96" opacity=".55"/><text x="128" y="63" font-size="14" fill="#B2182B" text-anchor="middle" font-weight="bold">A = 60</text><text x="128" y="80" font-size="10.5" fill="#B2182B" text-anchor="middle" >de la liste, en tension</text><path d="M236.3 43.2 Q361.4 42.7 488.0 44.4 Q489.1 66.4 488.7 88.6 Q361.6 88.5 236.3 87.7 Q235.5 65.7 235.8 43.6 Z" fill="#E3ECF6" stroke="#1E3A5F" stroke-width="1.6" stroke-linejoin="round"/><path d="M236.6 44.7 Q362.7 43.1 487.7 44.6 Q489.5 66.8 487.5 87.5 Q361.8 88.4 236.1 87.6 Q235.1 65.7 237.4 44.4 Z" fill="none" stroke="#1E3A5F" stroke-width="0.96" opacity=".55"/><text x="362" y="63" font-size="14" fill="#1E3A5F" text-anchor="middle" font-weight="bold">B = 70</text><text x="362" y="80" font-size="10.5" fill="#1E3A5F" text-anchor="middle" >de la liste, hors tension</text><path d="M488.5 44.4 Q614.3 43.2 739.3 44.5 Q741.8 65.4 740.0 87.9 Q613.8 88.4 487.8 87.6 Q486.6 65.5 487.4 43.5 Z" fill="#F6F8FA" stroke="#7A8795" stroke-width="1.6" stroke-linejoin="round"/><path d="M488.5 44.0 Q613.7 43.3 740.3 44.4 Q740.3 65.5 738.5 88.1 Q613.7 88.1 487.3 87.3 Q487.5 66.7 488.7 44.0 Z" fill="none" stroke="#7A8795" stroke-width="0.96" opacity=".55"/><text x="614" y="63" font-size="14" fill="#7A8795" text-anchor="middle" font-weight="bold">C = 70</text><text x="614" y="80" font-size="10.5" fill="#7A8795" text-anchor="middle" >autres métiers (et tension inconnue)</text><path d="M20.2 117.4 Q195.7 117.0 369.6 118.0 Q370.3 158.4 370.2 200.2 Q194.5 201.5 20.3 200.6 Q18.8 159.3 20.1 118.4 Z" fill="#FBE4E1" stroke="#B2182B" stroke-width="1.6" stroke-linejoin="round"/><path d="M21.6 118.4 Q194.8 118.5 370.4 119.2 Q371.8 158.2 368.5 200.2 Q195.8 200.9 19.6 198.4 Q19.5 158.6 21.2 118.7 Z" fill="none" stroke="#B2182B" stroke-width="0.96" opacity=".55"/><text x="36" y="142" font-size="13" fill="#B2182B"  font-weight="bold">Exposition</text><text x="36" y="164" font-size="13.5" fill="#2B2B2B"  font-weight="bold">= A / (A + B) = 60 / 130 = 46 %</text><text x="36" y="186" font-size="10.5" fill="#2B2B2B"  >sur 100 départs des métiers de la première sous-liste, 46 concernent</text><path d="M389.4 117.5 Q565.5 116.4 739.4 118.6 Q741.5 159.5 740.0 200.1 Q565.3 200.4 390.4 199.5 Q388.4 159.5 390.3 117.2 Z" fill="#E3ECF6" stroke="#1E3A5F" stroke-width="1.6" stroke-linejoin="round"/><path d="M390.4 118.2 Q564.4 117.6 739.9 119.5 Q741.1 159.0 739.5 199.8 Q564.7 199.5 389.4 198.6 Q388.8 158.6 391.0 117.2 Z" fill="none" stroke="#1E3A5F" stroke-width="0.96" opacity=".55"/><text x="406" y="142" font-size="13" fill="#1E3A5F"  font-weight="bold">Couverture</text><text x="406" y="164" font-size="13.5" fill="#2B2B2B"  font-weight="bold">= (A + B) / total = 130 / 200 = 65 %</text><text x="406" y="186" font-size="10.5" fill="#2B2B2B"  >les métiers de la liste portent 65 % des départs</text><text x="36" y="198" font-size="10.5" fill="#2B2B2B"  >des métiers en tension en France</text><text x="406" y="198" font-size="10.5" fill="#2B2B2B"  >au-dessus du minimum de 30 % : exposition interprétée</text><path d="M19.6 222.7 Q379.8 220.8 740.3 222.6 Q740.5 251.4 740.8 281.3 Q380.5 282.3 19.9 281.4 Q19.1 252.2 19.9 222.7 Z" fill="#fff" stroke="#7A8795" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M20.4 221.5 Q380.0 221.8 740.5 223.3 Q741.5 252.3 738.5 282.4 Q379.6 282.8 20.2 281.8 Q19.3 252.7 20.4 222.4 Z" fill="none" stroke="#7A8795" stroke-width="0.96" opacity=".55" stroke-dasharray="6 4"/><text x="36" y="246" font-size="12" fill="#2B2B2B"  >Repère : la même part calculée sur la France entière, par exemple 38 %.</text><text x="36" y="268" font-size="10.5" fill="#2B2B2B"  >Classe : Faible / Modérée / Forte selon des bornes écrites dans parametres_exposition_tension.csv (ici 46 % → Forte, borne haute 45 %).</text><text x="380" y="312" font-size="11.5" fill="#D97706" text-anchor="middle" >la part C n’entre pas dans l’exposition : elle sert à mesurer la couverture, c’est-à-dire ce que la liste ne voit pas</text></svg>