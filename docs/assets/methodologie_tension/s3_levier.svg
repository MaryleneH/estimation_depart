ke-width="1.2"/><rect x="330" y="94" width="12" height="16" rx="2" fill="#7A8795" stroke="#7A8795" stroke-width="1.2"/><rect x="345" y="94" width="12" height="16" rx="2" fill="#fff" stroke="#7A8795" stroke-width="1.2"/><rect x="360" y="94" width="12" height="16" rx="2" fill="#fff" stroke="#7A8795" stroke-width="1.2"/><text x="385" y="107" font-size="11" fill="#7A8795"  >rang 3</text><text x="30" y="133" font-size="11.5" fill="#2B2B2B"  >faible attractivité salariale</text><rect x="300" y="120" width="12" height="16" rx="2" fill="#7A8795" stroke="#7A8795" stroke-width="1.2"/><rect x="315" y="120" width="12" height="16" rx="2" fill="#7A8795" stroke="#7A8795" stroke-width="1.2"/><rect x="330" y="120" width="12" height="16" rx="2" fill="#fff" stroke="#7A8795" stroke-width="1.2"/><rect x="345" y="120" width="12" height="16" rx="2" fill="#fff" stroke="#7A8795" stroke-width="1.2"/><rect x="360" y="120" width="12" height="16" rx="2" fill="#fff" stroke="#7A8795" stroke-width="1.2"/><text x="385" y="133" font-size="11" fill="#7A8795"  >rang 2</text><text x="30" y="159" font-size="11.5" fill="#2B2B2B"  >inadéquation géographique</text><rect x="300" y="146" width="12" height="16" rx="2" fill="#7A8795" stroke="#7A8795" stroke-width="1.2"/><rect x="315" y="146" width="12" height="16" rx="2" fill="#7A8795" stroke="#7A8795" stroke-width="1.2"/><rect x="330" y="146" width="12" height="16" rx="2" fill="#fff" stroke="#7A8795" stroke-width="1.2"/><rect x="345" y="146" width="12" height="16" rx="2" fill="#fff" stroke="#7A8795" stroke-width="1.2"/><rect x="360" y="146" width="12" height="16" rx="2" fill="#fff" stroke="#7A8795" stroke-width="1.2"/><text x="385" y="159" font-size="11" fill="#7A8795"  >rang 2</text><text x="30" y="185" font-size="11.5" fill="#2B2B2B"  >emplois peu durables</text><rect x="300" y="172" width="12" height="16" rx="2" fill="#7A8795" stroke="#7A8795" stroke-width="1.2"/><rect x="315" y="172" width="12" height="16" rx="2" fill="#fff" stroke="#7A8795" stroke-width=